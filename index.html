<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="정총무 CRM">
<link rel="manifest" href="manifest.json">
<title>정총무 CRM — 가맹영업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, where, serverTimestamp, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
  import { getMessaging, getToken, onMessage } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js';

  // ─── CONFIG ────────────────────────────────────────────────────────
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDcZ7eFZWTHbc0scG5cxBpSVap7geXhRcc",
    authDomain: "my-awesome-370e5.firebaseapp.com",
    projectId: "my-awesome-370e5",
    storageBucket: "my-awesome-370e5.firebasestorage.app",
    messagingSenderId: "101537344828",
    appId: "1:101537344828:web:8f2453f136aa6206968239",
    measurementId: "G-SBQZPXM5L4"
  };
  const VAPID_KEY = "BF6TvEdV0j9Wea2sLX0FsqLBWJISkl1UMZdS2GNzUctMtXAbdIyI6tcHq-uzZbR5GETs7UMfYjksCwVFp3VkR0c";
  const ANTHROPIC_PROXY = "https://api.anthropic.com/v1/messages"; // via netlify function or direct

  // ─── INIT ───────────────────────────────────────────────────────────
  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let messaging = null;
  try { messaging = getMessaging(app); } catch(e) {}

  // ─── STATE ──────────────────────────────────────────────────────────
  let STATE = {
    user: null,
    leads: [],
    settings: { monthlyGoal: 10, sheetsId: "", sheetsApiKey: "" },
    activeTab: 'dashboard',
    activeLead: null,
    filterSource: 'all',
    filterStage: 'all',
    searchQuery: '',
    showAddModal: false,
    showLeadModal: false,
    showSettingsModal: false,
    showGoalModal: false,
    aiLoading: false,
    aiSuggestion: '',
    unsubscribes: []
  };

  const STAGES = ['잠재', '초기상담', '현장미팅', '제안서', '계약검토', '계약완료', '무산'];
  const STAGE_COLORS = {
    '잠재': '#4B5563',
    '초기상담': '#2563EB',
    '현장미팅': '#7C3AED',
    '제안서': '#D97706',
    '계약검토': '#DC2626',
    '계약완료': '#059669',
    '무산': '#6B7280'
  };
  const SOURCES = ['네이버광고', '카카오광고', '지인소개', '전화영업', '박람회', '홈페이지', '기타'];
  const SOURCE_ICONS = {
    '네이버광고': '🟢', '카카오광고': '🟡', '지인소개': '🤝',
    '전화영업': '📞', '박람회': '🏢', '홈페이지': '🌐', '기타': '📌'
  };

  // ─── RENDER ENGINE ──────────────────────────────────────────────────
  function $(id) { return document.getElementById(id); }

  function render() {
    if (!STATE.user) { renderAuth(); return; }
    renderApp();
  }

  function renderAuth() {
    document.body.innerHTML = `
    <div class="auth-screen">
      <div class="auth-card">
        <div class="auth-logo">
          <span class="auth-logo-mark">정</span>
          <div>
            <div class="auth-title">정총무 CRM</div>
            <div class="auth-sub">가맹영업 관리 시스템</div>
          </div>
        </div>
        <button id="btn-google-login" class="btn-google">
          <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Google로 로그인
        </button>
        <p class="auth-note">nippert-oss 팀 계정으로 접속하세요</p>
      </div>
    </div>`;
    $('btn-google-login').onclick = loginGoogle;
  }

  async function loginGoogle() {
    try {
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
    } catch(e) { showToast('로그인 실패: ' + e.message, 'error'); }
  }

  function renderApp() {
    const filtered = getFilteredLeads();
    document.body.innerHTML = `
    <div class="app" id="app">
      ${renderSidebar()}
      <main class="main" id="main-content">
        ${renderTopbar()}
        <div class="content-area" id="content-area">
          ${STATE.activeTab === 'dashboard' ? renderDashboard() :
            STATE.activeTab === 'pipeline' ? renderPipeline() :
            STATE.activeTab === 'leads' ? renderLeadsList(filtered) :
            STATE.activeTab === 'kpi' ? renderKPI() :
            renderLeadsList(filtered)}
        </div>
      </main>
    </div>
    ${STATE.showAddModal ? renderAddModal() : ''}
    ${STATE.showLeadModal && STATE.activeLead ? renderLeadModal() : ''}
    ${STATE.showSettingsModal ? renderSettingsModal() : ''}
    ${STATE.showGoalModal ? renderGoalModal() : ''}
    <div id="toast-container"></div>`;
    attachListeners();
  }

  function renderSidebar() {
    const tabs = [
      { id: 'dashboard', icon: '⬡', label: '대시보드' },
      { id: 'pipeline', icon: '◈', label: '파이프라인' },
      { id: 'leads', icon: '◉', label: '리드 목록' },
      { id: 'kpi', icon: '▣', label: 'KPI 분석' },
    ];
    return `
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark">정</span>
        <div class="brand-text">
          <div class="brand-name">정총무 CRM</div>
          <div class="brand-ver">v3.0</div>
        </div>
      </div>
      <nav class="sidebar-nav">
        ${tabs.map(t => `
          <button class="nav-item ${STATE.activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">
            <span class="nav-icon">${t.icon}</span>
            <span class="nav-label">${t.label}</span>
          </button>`).join('')}
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" id="btn-settings">
          <span class="nav-icon">⚙</span>
          <span class="nav-label">설정</span>
        </button>
        <button class="nav-item" id="btn-logout">
          <span class="nav-icon">↪</span>
          <span class="nav-label">로그아웃</span>
        </button>
        <div class="user-chip">
          <img src="${STATE.user?.photoURL || ''}" class="user-avatar" onerror="this.style.display='none'">
          <span class="user-name">${STATE.user?.displayName?.split(' ')[0] || '사용자'}</span>
        </div>
      </div>
    </aside>`;
  }

  function renderTopbar() {
    const monthGoal = STATE.settings.monthlyGoal || 10;
    const monthWon = STATE.leads.filter(l => {
      if (l.stage !== '계약완료') return false;
      const d = l.updatedAt?.toDate ? l.updatedAt.toDate() : new Date(l.updatedAt);
      const now = new Date();
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }).length;
    const pct = Math.min(100, Math.round((monthWon / monthGoal) * 100));
    return `
    <header class="topbar">
      <div class="topbar-left">
        <div class="month-goal-widget" id="btn-goal-modal">
          <div class="goal-label">이달 목표</div>
          <div class="goal-progress-bar"><div class="goal-fill" style="width:${pct}%"></div></div>
          <div class="goal-stat"><span class="goal-done">${monthWon}</span><span class="goal-sep">/</span><span class="goal-total">${monthGoal}</span><span class="goal-unit">건 계약</span><span class="goal-pct">${pct}%</span></div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="search-wrap">
          <input type="text" id="search-input" placeholder="리드 검색..." value="${STATE.searchQuery}" class="search-input">
          <span class="search-icon">🔍</span>
        </div>
        <button class="btn-primary" id="btn-add-lead">
          <span>+ 리드 추가</span>
        </button>
        <button class="btn-icon" id="btn-sync-sheets" title="Sheets 동기화">⟳</button>
      </div>
    </header>`;
  }

  // ─── DASHBOARD ─────────────────────────────────────────────────────
  function renderDashboard() {
    const leads = STATE.leads;
    const total = leads.length;
    const active = leads.filter(l => !['계약완료','무산'].includes(l.stage)).length;
    const won = leads.filter(l => l.stage === '계약완료').length;
    const lost = leads.filter(l => l.stage === '무산').length;
    const winRate = total > 0 ? Math.round((won / (won + lost || 1)) * 100) : 0;

    // Stage breakdown
    const stageCounts = {};
    STAGES.forEach(s => stageCounts[s] = leads.filter(l => l.stage === s).length);

    // Source breakdown
    const sourceCounts = {};
    SOURCES.forEach(s => sourceCounts[s] = leads.filter(l => l.source === s).length);
    const topSource = Object.entries(sourceCounts).sort((a,b) => b[1]-a[1])[0];

    // Recent activity
    const recent = [...leads].sort((a,b) => {
      const da = a.updatedAt?.toDate ? a.updatedAt.toDate() : new Date(a.updatedAt || 0);
      const db2 = b.updatedAt?.toDate ? b.updatedAt.toDate() : new Date(b.updatedAt || 0);
      return db2 - da;
    }).slice(0, 5);

    // Follow-up due
    const today = new Date();
    today.setHours(0,0,0,0);
    const overdue = leads.filter(l => {
      if (!l.nextAction) return false;
      const d = new Date(l.nextAction);
      return d <= today && !['계약완료','무산'].includes(l.stage);
    });

    return `
    <div class="dashboard">
      <div class="dash-grid-top">
        <div class="kpi-card kpi-total">
          <div class="kpi-icon">◉</div>
          <div class="kpi-body">
            <div class="kpi-num">${total}</div>
            <div class="kpi-lbl">전체 리드</div>
          </div>
        </div>
        <div class="kpi-card kpi-active">
          <div class="kpi-icon">▶</div>
          <div class="kpi-body">
            <div class="kpi-num">${active}</div>
            <div class="kpi-lbl">진행 중</div>
          </div>
        </div>
        <div class="kpi-card kpi-won">
          <div class="kpi-icon">✓</div>
          <div class="kpi-body">
            <div class="kpi-num">${won}</div>
            <div class="kpi-lbl">계약완료</div>
          </div>
        </div>
        <div class="kpi-card kpi-rate">
          <div class="kpi-icon">%</div>
          <div class="kpi-body">
            <div class="kpi-num">${winRate}<span class="kpi-unit">%</span></div>
            <div class="kpi-lbl">승률</div>
          </div>
        </div>
      </div>

      ${overdue.length > 0 ? `
      <div class="alert-banner">
        <span class="alert-icon">⚠</span>
        <span>후속 조치 지연 <strong>${overdue.length}건</strong> — ${overdue.slice(0,3).map(l=>`<span class="alert-lead" data-id="${l.id}">${l.name}</span>`).join(', ')}${overdue.length > 3 ? ` 외 ${overdue.length-3}건` : ''}</span>
      </div>` : ''}

      <div class="dash-grid-bottom">
        <div class="dash-card">
          <div class="dash-card-title">단계별 현황</div>
          <div class="stage-bars">
            ${STAGES.filter(s => s !== '무산').map(s => {
              const cnt = stageCounts[s] || 0;
              const maxCnt = Math.max(...STAGES.filter(x=>x!=='무산').map(x => stageCounts[x]||0), 1);
              const w = Math.round((cnt/maxCnt)*100);
              return `<div class="stage-bar-row">
                <span class="stage-bar-lbl">${s}</span>
                <div class="stage-bar-track">
                  <div class="stage-bar-fill" style="width:${w}%;background:${STAGE_COLORS[s]}"></div>
                </div>
                <span class="stage-bar-cnt">${cnt}</span>
              </div>`;
            }).join('')}
          </div>
        </div>

        <div class="dash-card">
          <div class="dash-card-title">소스별 리드</div>
          <div class="source-list">
            ${SOURCES.map(s => {
              const cnt = sourceCounts[s] || 0;
              if (!cnt) return '';
              const maxCnt = Math.max(...SOURCES.map(x => sourceCounts[x]||0), 1);
              const w = Math.round((cnt/maxCnt)*100);
              return `<div class="source-row">
                <span class="source-icon">${SOURCE_ICONS[s]}</span>
                <span class="source-lbl">${s}</span>
                <div class="source-bar-track">
                  <div class="source-bar-fill" style="width:${w}%"></div>
                </div>
                <span class="source-cnt">${cnt}</span>
              </div>`;
            }).join('')}
          </div>
        </div>

        <div class="dash-card dash-card-wide">
          <div class="dash-card-title">최근 활동</div>
          <div class="activity-list">
            ${recent.length === 0 ? '<div class="empty-state">리드가 없습니다</div>' :
              recent.map(l => `
              <div class="activity-row" data-id="${l.id}">
                <div class="activity-stage-dot" style="background:${STAGE_COLORS[l.stage]}"></div>
                <div class="activity-info">
                  <div class="activity-name">${l.name}</div>
                  <div class="activity-meta">${l.brand || ''} · ${l.source || ''}</div>
                </div>
                <div class="activity-right">
                  <span class="stage-badge" style="--c:${STAGE_COLORS[l.stage]}">${l.stage}</span>
                  <span class="activity-date">${formatDate(l.updatedAt)}</span>
                </div>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>`;
  }

  // ─── PIPELINE (KANBAN) ─────────────────────────────────────────────
  function renderPipeline() {
    const activeStages = STAGES.filter(s => s !== '무산');
    return `
    <div class="pipeline-view">
      <div class="pipeline-header">
        <div class="pipe-filter-group">
          <span class="filter-label">소스:</span>
          ${['all', ...SOURCES].map(s => `
            <button class="filter-chip ${STATE.filterSource === s ? 'active' : ''}" data-filter-source="${s}">
              ${s === 'all' ? '전체' : SOURCE_ICONS[s] + ' ' + s}
            </button>`).join('')}
        </div>
      </div>
      <div class="kanban-board">
        ${activeStages.map(stage => {
          const cards = STATE.leads.filter(l => l.stage === stage &&
            (STATE.filterSource === 'all' || l.source === STATE.filterSource));
          return `
          <div class="kanban-col" data-stage="${stage}">
            <div class="kanban-col-header">
              <div class="kanban-col-dot" style="background:${STAGE_COLORS[stage]}"></div>
              <span class="kanban-col-title">${stage}</span>
              <span class="kanban-col-cnt">${cards.length}</span>
            </div>
            <div class="kanban-cards" id="col-${stage}">
              ${cards.map(l => renderKanbanCard(l)).join('')}
              <button class="kanban-add-btn" data-stage="${stage}">+ 추가</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  function renderKanbanCard(lead) {
    const today = new Date(); today.setHours(0,0,0,0);
    const isOverdue = lead.nextAction && new Date(lead.nextAction) <= today && !['계약완료','무산'].includes(lead.stage);
    return `
    <div class="kanban-card ${isOverdue ? 'overdue' : ''}" data-id="${lead.id}">
      <div class="card-top">
        <span class="card-source">${SOURCE_ICONS[lead.source] || '📌'} ${lead.source || ''}</span>
        ${isOverdue ? '<span class="card-overdue-badge">지연</span>' : ''}
      </div>
      <div class="card-name">${lead.name}</div>
      <div class="card-brand">${lead.brand || '—'}</div>
      ${lead.nextAction ? `<div class="card-next-action">📅 ${lead.nextAction}</div>` : ''}
    </div>`;
  }

  // ─── LEADS LIST ────────────────────────────────────────────────────
  function renderLeadsList(leads) {
    return `
    <div class="leads-view">
      <div class="leads-filters">
        <div class="filter-group">
          <span class="filter-label">단계:</span>
          ${['all', ...STAGES].map(s => `
            <button class="filter-chip ${STATE.filterStage === s ? 'active' : ''}" data-filter-stage="${s}">
              ${s === 'all' ? '전체' : s}
            </button>`).join('')}
        </div>
        <div class="filter-group">
          <span class="filter-label">소스:</span>
          ${['all', ...SOURCES].map(s => `
            <button class="filter-chip ${STATE.filterSource === s ? 'active' : ''}" data-filter-source="${s}">
              ${s === 'all' ? '전체' : SOURCE_ICONS[s] + ' ' + s}
            </button>`).join('')}
        </div>
      </div>
      <div class="leads-table-wrap">
        <table class="leads-table">
          <thead>
            <tr>
              <th>이름</th><th>브랜드</th><th>단계</th><th>소스</th><th>다음 액션</th><th>담당자</th><th>메모</th><th>날짜</th>
            </tr>
          </thead>
          <tbody>
            ${leads.length === 0 ? `<tr><td colspan="8" class="empty-state">해당 리드가 없습니다</td></tr>` :
              leads.map(l => `
              <tr class="lead-row" data-id="${l.id}">
                <td class="lead-name-cell">${l.name}</td>
                <td>${l.brand || '—'}</td>
                <td><span class="stage-badge" style="--c:${STAGE_COLORS[l.stage]}">${l.stage}</span></td>
                <td>${SOURCE_ICONS[l.source] || ''} ${l.source || '—'}</td>
                <td class="${isOverdueDate(l.nextAction, l.stage) ? 'overdue-text' : ''}">${l.nextAction || '—'}</td>
                <td>${l.assignee || '—'}</td>
                <td class="memo-cell">${(l.memo || '').substring(0,30)}${(l.memo||'').length > 30 ? '...' : ''}</td>
                <td>${formatDate(l.updatedAt)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  // ─── KPI ────────────────────────────────────────────────────────────
  function renderKPI() {
    const leads = STATE.leads;
    const total = leads.length;

    // Stage conversion rates
    const stageOrder = ['잠재','초기상담','현장미팅','제안서','계약검토','계약완료'];
    const convRates = [];
    for (let i = 0; i < stageOrder.length - 1; i++) {
      const from = leads.filter(l => {
        const si = STAGES.indexOf(l.stage);
        return si >= STAGES.indexOf(stageOrder[i]);
      }).length;
      const to = leads.filter(l => {
        const si = STAGES.indexOf(l.stage);
        return si >= STAGES.indexOf(stageOrder[i+1]);
      }).length;
      convRates.push({ from: stageOrder[i], to: stageOrder[i+1], rate: from > 0 ? Math.round((to/from)*100) : 0, from_cnt: from, to_cnt: to });
    }

    // Source win rates
    const sourceStats = SOURCES.map(s => {
      const total_s = leads.filter(l => l.source === s).length;
      const won_s = leads.filter(l => l.source === s && l.stage === '계약완료').length;
      const lost_s = leads.filter(l => l.source === s && l.stage === '무산').length;
      const active_s = total_s - won_s - lost_s;
      const wr = (won_s + lost_s) > 0 ? Math.round((won_s/(won_s+lost_s))*100) : null;
      return { source: s, total: total_s, won: won_s, lost: lost_s, active: active_s, winRate: wr };
    }).filter(s => s.total > 0);

    // Monthly trend (last 6 months)
    const monthlyData = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date();
      d.setMonth(d.getMonth() - i);
      const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const added = leads.filter(l => {
        const ld = l.createdAt?.toDate ? l.createdAt.toDate() : new Date(l.createdAt || 0);
        return `${ld.getFullYear()}-${String(ld.getMonth()+1).padStart(2,'0')}` === ym;
      }).length;
      const won_m = leads.filter(l => {
        if (l.stage !== '계약완료') return false;
        const ld = l.updatedAt?.toDate ? l.updatedAt.toDate() : new Date(l.updatedAt || 0);
        return `${ld.getFullYear()}-${String(ld.getMonth()+1).padStart(2,'0')}` === ym;
      }).length;
      monthlyData.push({ month: `${d.getMonth()+1}월`, added, won: won_m });
    }
    const maxMonth = Math.max(...monthlyData.map(m => Math.max(m.added, m.won)), 1);

    return `

  async function saveLead() {
    const name = $('f-name')?.value?.trim();
    if (!name) { showToast('이름을 입력하세요', 'error'); return; }
    try {
      const data = {
        name, phone: $('f-phone')?.value || '',
        brand: $('f-brand')?.value || '', region: $('f-region')?.value || '',
        source: $('f-source')?.value || '기타', stage: $('f-stage')?.value || '잠재',
        assignee: $('f-assignee')?.value || '', memo: $('f-memo')?.value || '',
        nextAction: $('f-next-action')?.value || '',
        history: [], createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
        createdBy: STATE.user.uid
      };
      await addDoc(collection(db, 'leads'), data);
      STATE.showAddModal = false;
      showToast('리드가 추가되었습니다 ✓');
      render();
    } catch(e) { showToast('저장 실패: ' + e.message, 'error'); }
  }

  async function updateLead() {
    const l = STATE.activeLead;
    if (!l) return;
    try {
      const prevStage = l.stage;
      const newStage = $('e-stage')?.value;
      const data = {
        name: $('e-name')?.value || l.name,
        phone: $('e-phone')?.value || '', brand: $('e-brand')?.value || '',
        region: $('e-region')?.value || '', stage: newStage,
        source: $('e-source')?.value || l.source, assignee: $('e-assignee')?.value || '',
        memo: $('e-memo')?.value || '', nextAction: $('e-next-action')?.value || '',
        updatedAt: serverTimestamp()
      };
      await updateDoc(doc(db, 'leads', l.id), data);
      if (prevStage !== newStage) {
        showToast(`단계 변경: ${prevStage} → ${newStage} ✓`);
      } else {
        showToast('저장되었습니다 ✓');
      }
      STATE.showLeadModal = false;
      STATE.activeLead = null;
      STATE.aiSuggestion = '';
      render();
    } catch(e) { showToast('저장 실패: ' + e.message, 'error'); }
  }

  async function deleteLead() {
    const l = STATE.activeLead;
    if (!l) return;
    if (!confirm(`"${l.name}" 리드를 삭제하시겠습니까?`)) return;
    try {
      await deleteDoc(doc(db, 'leads', l.id));
      STATE.showLeadModal = false; STATE.activeLead = null;
      showToast('삭제되었습니다');
      render();
    } catch(e) { showToast('삭제 실패: ' + e.message, 'error'); }
  }

  async function addHistory() {
    const text = $('history-input')?.value?.trim();
    if (!text || !STATE.activeLead) return;
    const l = STATE.activeLead;
    const entry = {
      text, date: new Date().toLocaleDateString('ko-KR'),
      by: STATE.user?.displayName || '사용자'
    };
    const history = [...(l.history || []), entry];
    try {
      await updateDoc(doc(db, 'leads', l.id), { history, updatedAt: serverTimestamp() });
      STATE.activeLead = { ...l, history };
      render();
      $('history-input').value = '';
    } catch(e) { showToast('기록 실패: ' + e.message, 'error'); }
  }

  function openLead(id) {
    const lead = STATE.leads.find(l => l.id === id);
    if (!lead) return;
    STATE.activeLead = lead;
    STATE.showLeadModal = true;
    STATE.aiSuggestion = '';
    render();
  }

  // ─── AI SUGGESTION ──────────────────────────────────────────────────
  async function getAISuggestion() {
    const l = STATE.activeLead;
    if (!l) return;
    const key = STATE.settings.anthropicKey;
    if (!key) { showToast('설정에서 Anthropic API Key를 입력하세요', 'error'); return; }

    STATE.aiLoading = true;
    render();

    const prompt = `당신은 프랜차이즈 가맹영업 전문가입니다.

아래 리드 정보를 보고 최적의 다음 영업 액션을 한국어로 구체적으로 추천해주세요.

[리드 정보]
- 이름: ${l.name}
- 희망 브랜드: ${l.brand || '미정'}
- 지역: ${l.region || '미정'}
- 현재 단계: ${l.stage}
- 유입 소스: ${l.source}
- 메모: ${l.memo || '없음'}
- 최근 히스토리: ${(l.history||[]).slice(-2).map(h=>h.text).join(' / ') || '없음'}

다음 형식으로 답변해주세요:
1. **추천 액션** (구체적인 행동 1-2가지)
2. **타이밍** (언제 연락/방문할지)
3. **핵심 포인트** (이 리드에게 강조할 내용)`;

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 600,
          messages: [{ role: 'user', content: prompt }]
        })
      });
      const data = await res.json();
      STATE.aiSuggestion = data.content?.[0]?.text || '추천을 가져오지 못했습니다.';
    } catch(e) {
      STATE.aiSuggestion = '오류가 발생했습니다: ' + e.message;
    }
    STATE.aiLoading = false;
    render();
  }

  // ─── SETTINGS ────────────────────────────────────────────────────────
  async function saveSettings() {
    const settings = {
      ...STATE.settings,
      firebaseApiKey: $('s-api-key')?.value || '',
      firebaseAppId: $('s-app-id')?.value || '',
      firebaseSenderId: $('s-sender-id')?.value || '',
      vapidKey: $('s-vapid')?.value || '',
      sheetsId: $('s-sheets-id')?.value || '',
      sheetsApiKey: $('s-sheets-key')?.value || '',
      anthropicKey: $('s-anthropic-key')?.value || ''
    };
    try {
      await setDoc(doc(db, 'settings', STATE.user.uid), settings);
      STATE.settings = settings;
      STATE.showSettingsModal = false;
      showToast('설정이 저장되었습니다 ✓');
      render();
      initFCM();
    } catch(e) { showToast('설정 저장 실패: ' + e.message, 'error'); }
  }

  async function saveGoal() {
    const goal = parseInt($('g-goal')?.value) || 10;
    STATE.settings.monthlyGoal = goal;
    try {
      await setDoc(doc(db, 'settings', STATE.user.uid), STATE.settings, { merge: true });
      STATE.showGoalModal = false;
      showToast(`월 목표: ${goal}건 ✓`);
      render();
    } catch(e) { showToast('저장 실패', 'error'); }
  }

  // ─── GOOGLE SHEETS SYNC ─────────────────────────────────────────────
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHGmB0DUx-9rXQlp36k5UFds_khzr2bXMKnsKdUEt7mHRrQFBP3onRRpMEKchqYIb6Fw/exec";

  async function syncToSheets() {
    showToast('Sheets 동기화 중...', 'info');
    try {
      const leads = STATE.leads.map(l => [
        l.name, l.phone||'', l.brand||'', l.region||'', l.stage, l.source||'',
        l.assignee||'', l.nextAction||'', l.memo||'', formatDate(l.updatedAt)
      ]);
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ leads })
      });
      showToast(`Sheets 동기화 완료 ✓ (${STATE.leads.length}건)`);
    } catch(e) {
      showToast('Sheets 오류: ' + e.message, 'error');
    }
  }

  // ─── FCM PUSH ────────────────────────────────────────────────────────
  async function initFCM() {
    if (!messaging || !STATE.settings.vapidKey) return;
    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') return;
      const token = await getToken(messaging, { vapidKey: STATE.settings.vapidKey });
      if (token) {
        await setDoc(doc(db, 'fcm_tokens', STATE.user.uid), { token, uid: STATE.user.uid, updatedAt: serverTimestamp() }, { merge: true });
        console.log('FCM token saved');
      }
      onMessage(messaging, (payload) => {
        showToast(`🔔 ${payload.notification?.title}: ${payload.notification?.body}`);
      });
    } catch(e) { console.log('FCM init failed:', e); }
  }

  // ─── FIRESTORE LISTENER ─────────────────────────────────────────────
  function subscribeLeads() {
    const q = query(collection(db, 'leads'), orderBy('updatedAt', 'desc'));
    const unsub = onSnapshot(q, (snap) => {
      STATE.leads = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    });
    STATE.unsubscribes.push(unsub);
  }

  async function loadSettings() {
    try {
      const snap = await getDoc(doc(db, 'settings', STATE.user.uid));
      if (snap.exists()) STATE.settings = { ...STATE.settings, ...snap.data() };
    } catch(e) {}
  }

  // ─── AUTH ────────────────────────────────────────────────────────────
  onAuthStateChanged(auth, async (user) => {
    STATE.unsubscribes.forEach(u => u());
    STATE.unsubscribes = [];
    if (user) {
      STATE.user = user;
      await loadSettings();
      subscribeLeads();
      initFCM();
    } else {
      STATE.user = null;
      STATE.leads = [];
      render();
    }
  });

  // ─── HELPERS ─────────────────────────────────────────────────────────
  function getFilteredLeads() {
    return STATE.leads.filter(l => {
      if (STATE.filterStage !== 'all' && l.stage !== STATE.filterStage) return false;
      if (STATE.filterSource !== 'all' && l.source !== STATE.filterSource) return false;
      if (STATE.searchQuery) {
        const q = STATE.searchQuery.toLowerCase();
        return (l.name||'').toLowerCase().includes(q) ||
               (l.brand||'').toLowerCase().includes(q) ||
               (l.phone||'').includes(q) || (l.region||'').includes(q);
      }
      return true;
    });
  }

  function formatDate(ts) {
    if (!ts) return '—';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const now = new Date();
    const diff = Math.floor((now - d) / (1000*60*60*24));
    if (diff === 0) return '오늘';
    if (diff === 1) return '어제';
    if (diff < 7) return `${diff}일 전`;
    return `${d.getMonth()+1}/${d.getDate()}`;
  }

  function isOverdueDate(dateStr, stage) {
    if (!dateStr || ['계약완료','무산'].includes(stage)) return false;
    const today = new Date(); today.setHours(0,0,0,0);
    return new Date(dateStr) <= today;
  }

  function showToast(msg, type = 'success') {
    const tc = $('toast-container');
    if (!tc) return;
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.textContent = msg;
    tc.appendChild(t);
    setTimeout(() => t.classList.add('show'), 10);
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
  }

  // ─── INITIAL RENDER ──────────────────────────────────────────────────
  render();
</script>
